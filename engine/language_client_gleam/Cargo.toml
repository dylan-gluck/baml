[package]
name = "baml-gleam-ffi"
edition = "2021"
version.workspace = true
authors.workspace = true
description = "BAML Gleam bindings for Erlang and JavaScript targets"
license = "Apache-2.0"

[lib]
name = "baml_gleam"
crate-type = ["cdylib"]

[lints.rust]
dead_code = "deny"
elided_named_lifetimes = "deny"
unused_imports = "deny"
unused_must_use = "deny"
unused_variables = "deny"

[lints.clippy]
too_many_arguments = "allow"

[dependencies]
anyhow.workspace = true
baml-cli.workspace = true
baml-ids.workspace = true
baml-log.workspace = true
baml-runtime = { path = "../baml-runtime", default-features = false, features = [
  "internal",
] }
baml-types.workspace = true
internal-baml-codegen.workspace = true
internal-baml-core.workspace = true
serde.workspace = true
serde_json.workspace = true
indexmap.workspace = true
once_cell.workspace = true
env_logger.workspace = true
futures.workspace = true
log.workspace = true
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
stream-cancel = "0.8"
dashmap = "5.5"

# Erlang NIF support
rustler = { version = "0.34", optional = true }
rustler_codegen = { version = "0.34", optional = true }

# WASM/JavaScript support
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["erlang"]
erlang = ["rustler", "rustler_codegen"]
javascript = ["wasm-bindgen", "wasm-bindgen-futures", "js-sys", "web-sys", "serde-wasm-bindgen", "console_error_panic_hook"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }